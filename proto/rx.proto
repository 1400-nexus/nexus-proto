syntax = "proto3";

package nexus.rx;

import "common.proto";

import "ipc.proto";

message ReceiverHello {
  uint32 receiver_id = 1;
  uint32 pid = 2;
  uint32 listen_port = 3;
  bytes proto_hash = 4;
}

message ManifestSeen {
  uint32 receiver_id = 1;
  nexus.common.Manifest manifest = 2;
}

message BlockDecoded {
  string session_id = 1;
  uint32 receiver_id = 2;
  repeated uint32 block_ids = 3;
}

message ReceiverStats {
  uint32 receiver_id = 1;
  uint64 pkts_ok = 2;
  uint64 crc_fail = 3;
  uint64 bad_magic = 4;
  uint64 unparsable = 5;
  uint64 duplicates = 6;
  uint64 no_session = 7;
  uint64 arena_exhausted = 8;
  uint64 kernel_drops = 9;
  uint32 arena_high_water_pct = 10;
}

message Config {
  string shm_name = 1;
  string staging_dir = 2;
  string journal_dir = 3;
}

message SessionOpen {
  string session_id = 1;
  string dest_path = 2;
  uint32 total_blocks = 3;
  uint32 k = 4;
  uint32 n = 5;
  uint32 block_bytes = 6;
  uint64 block_table_offset = 7;
  uint64 bitmap_offset = 8;
}

message PurgeSession {
  string session_id = 1;
  string reason = 2;
}

message RxEnvelope {
  oneof msg {
    ReceiverHello receiver_hello = 1;
    ManifestSeen manifest_seen = 2;
    BlockDecoded block_decoded = 3;
    ReceiverStats receiver_stats = 4;
    nexus.ipc.Heartbeat heartbeat = 5;

    Config config = 10;
    SessionOpen session_open = 11;
    PurgeSession purge_session = 12;
  }
}
